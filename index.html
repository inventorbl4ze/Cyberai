
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERAI - Your AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>🤖 CYBERAI</h2>
    <span>ONLINE</span>
  </header>

  <main>
    <div class="welcome">
      <h1>Your AI. Your Assistant.</h1>
      <p>Welcome to CYBERAI. How can I help you today?</p>
    </div>

<div class="telegram-connect">
  <a
    href="https://t.me/inventor_abby_bot"
    target="_blank"
    rel="noopener noreferrer"
  >
    ✈️ Chat with CYBERAI on Telegram
  </a>
</div>
    
    <section class="chat-box" id="chatBox">
      <div class="message bot">
        Hello! I am CYBERAI. Ask me anything!
      </div>
    </section>

    <form id="chatForm">
      <input
        type="text"
        id="userInput"
        placeholder="Message CYBERAI..."
        required
      >
      <button type="submit">➤</button>
    </form>
  </main>

  <footer>
    Powered by CYBERAI
  </footer>

  <script src="script.js"></script>
</body>
                               </html>
